<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPER U 四店经营对比看板</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0e1b2a; --navy2:#16283c; --gold:#C68E31; --gold-bg:#fdf6e8;
  --ink:#1c2733; --muted:#5b6b7c; --line:#e3e8ee; --bg:#f2f5f8; --card:#ffffff;
  --brand:#3E7096; --ok:#2e7d4f; --warn:#b26a00; --bad:#c0392b; --info:#3E7096;
  --rongxin:#c0392b; --superushop:#3E7096; --superudisplay:#2e7d4f; --finey:#8a6d3b;
  --shadow:0 1px 3px rgba(14,27,42,.08),0 4px 16px rgba(14,27,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:14.5px}
h1,h2,h3,.serif{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",Georgia,serif}
a{color:var(--brand)}
button{font-family:inherit}

/* ===== 布局 ===== */
#layout{display:flex;min-height:100dvh}
#sidebar{width:236px;background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#cdd8e4;position:fixed;top:0;bottom:0;left:0;z-index:60;display:flex;flex-direction:column;transition:transform .28s ease}
#sidebar .logo{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
#sidebar .logo .en{font-size:11px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
#sidebar .logo .zh{font-size:19px;color:#fff;margin-top:2px;font-weight:700}
#sidebar .logo .win{font-size:10.5px;color:#7f92a6;margin-top:6px;line-height:1.5}
#nav{flex:1;overflow-y:auto;padding:10px 0 90px}
#nav .group{padding:12px 18px 4px;font-size:10.5px;letter-spacing:.18em;color:#6e8299}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;margin:1px 8px;border-radius:8px;cursor:pointer;color:#cdd8e4;font-size:13.8px;border:none;background:none;width:calc(100% - 16px);text-align:left;position:relative}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(198,142,49,.16);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--gold)}
.nav-item .dot{width:9px;height:9px;border-radius:3px;flex:none}
.nav-item .cnt{margin-left:auto;background:var(--gold);color:#fff;font-size:10.5px;border-radius:99px;padding:0 6px;line-height:16px}
#app-main-wrap{flex:1;min-width:0}
#main{margin-left:236px;padding:26px 30px 90px;max-width:1160px}

/* ===== 顶栏（移动端） ===== */
#topbar{display:none;position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:10px 14px;align-items:center;gap:10px}
#topbar .t{font-size:15px;font-weight:700}
#burger{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:36px;height:36px;font-size:17px;cursor:pointer}
#scrim{display:none;position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:55}

/* ===== 卡片与组件 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;position:relative}
.card>h2{font-size:17.5px;margin-bottom:4px;padding-left:11px;border-left:4px solid var(--gold);line-height:1.35}
.card>h2 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px;padding-left:15px}
.hero{background:linear-gradient(135deg,#2c4a63 0%,#3E7096 60%,#4a7fa8 100%);border:none;color:#fff}
.hero .k{font-size:12px;letter-spacing:.2em;color:#ffd98a;text-transform:uppercase}
.hero h1{font-size:26px;margin:6px 0 10px;line-height:1.3}
.hero p{color:#dbe7f1;font-size:13.8px;max-width:860px}
.badge{display:inline-block;font-size:11px;border-radius:99px;padding:1px 9px;line-height:18px;vertical-align:middle}
.b-ok{background:#e6f3ea;color:var(--ok)} .b-warn{background:#fdf1dd;color:var(--warn)} .b-bad{background:#fae4e1;color:var(--bad)} .b-info{background:#e7eff6;color:var(--info)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:0}
.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:800;margin:3px 0 1px;letter-spacing:-.01em}
.kpi .n{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f2f6fa;color:#43566b;text-align:left;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #edf1f5;vertical-align:top}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.plain{background:var(--gold-bg);border:1px solid #ecd9b0;border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;font-size:14px;margin-top:16px}
.plain .t{color:#8a5b00;font-weight:700}
.plain b{color:#7a4f00}
.hl{background:linear-gradient(transparent 55%,#ffe9a8 55%);font-weight:700;padding:0 1px}
.pc{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:14px 16px;background:#fbfcfe}
.pc .tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:1px 8px;color:#fff}
.pc h3{font-size:15px;margin:8px 0 8px}
.pc .row{font-size:13px;margin:3px 0}
.pc .row b.k{color:var(--muted);font-weight:600;margin-right:2px}
.pc.p0{border-left-color:var(--bad)} .pc.p0 .tag{background:var(--bad)}
.pc.p1{border-left-color:var(--warn)} .pc.p1 .tag{background:var(--warn)}
.pc.p2{border-left-color:#5b7286} .pc.p2 .tag{background:#5b7286}
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fbfcfe}
.mini .nm{font-weight:700;font-size:13.5px}
.mini .md{font-size:11px;color:var(--muted);margin:2px 0 6px}
.mini .vd{font-size:12.3px}
.chart-box{position:relative;height:250px}
.chart-box canvas{max-width:100%!important}
.canvas-holder{min-width:0}
.canvas-holder{background:#fbfcfe;border:1px solid var(--line);border-radius:12px;padding:14px}
.canvas-holder h3{font-size:13.5px;margin-bottom:8px;color:#43566b}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pat{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fbfcfe}
.pat h3{font-size:14px;margin-bottom:5px}
.pat p{font-size:12.8px;color:#43566b}
.verdict{font-size:14.5px;color:#2c3e50}
ul.tick{padding-left:1.2em}
ul.tick li{margin:5px 0;font-size:13.3px}
ul.tick.danger li::marker{content:"▲ ";color:var(--bad);font-size:.8em}
ul.tick.good li::marker{content:"◆ ";color:var(--ok);font-size:.8em}
.mode-chip{display:inline-block;background:#eef3f8;border:1px solid #d7e2ec;color:#3a556e;border-radius:8px;font-size:11.5px;padding:1px 9px}

/* ===== 原版报告整页嵌入 ===== */
.embed-wrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.report-frame{display:block;width:100%;height:calc(100dvh - 130px);min-height:560px;border:none;background:#fff}

/* ===== 标注 ===== */
#fab{position:fixed;right:22px;bottom:26px;z-index:70;background:var(--gold);color:#fff;border:none;border-radius:99px;padding:11px 20px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(198,142,49,.45);cursor:pointer}
#fab:hover{filter:brightness(1.06)}
.anno-item{border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:10px;background:#fffdf6}
.anno-item .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.anno-item .body{font-size:13.6px;white-space:pre-wrap;word-break:break-word}
.anno-item .del{float:right;background:none;border:none;color:#b23b2e;cursor:pointer;font-size:12px;padding:0}
.anno-item .loc{float:right;background:none;border:none;color:var(--brand);cursor:pointer;font-size:12px;padding:0;margin-right:12px}
.quote-src{color:#7a5b00;background:var(--gold-bg);border-radius:6px;padding:4px 9px;margin:6px 0;font-size:12.5px}
.card-anno{position:absolute;top:12px;right:12px;border:1px solid var(--line);background:#fff;border-radius:8px;height:28px;padding:0 9px;cursor:pointer;font-size:13px;line-height:26px;box-shadow:0 1px 2px rgba(14,27,42,.06)}
.card-anno:hover{border-color:var(--gold);background:var(--gold-bg)}
.card-anno .n{font-size:11px;font-weight:700;color:#8a5b00}
.anno-hl{background:#fff0b3;border-bottom:2px dotted var(--gold);cursor:pointer;border-radius:2px;padding:0 1px}
.anno-hl:hover{background:#ffe9a8}
#selBtn{position:fixed;z-index:80;display:none;background:var(--gold);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(198,142,49,.45);white-space:nowrap}
@keyframes annoflash{0%{box-shadow:0 0 0 4px rgba(198,142,49,.75)}100%{box-shadow:0 0 0 4px rgba(198,142,49,0)}}
.flash{animation:annoflash 1.2s ease-out 2}
.anchor-badge{display:inline-block;background:#fdf1dd;color:#8a5b00;border-radius:6px;font-size:11px;padding:0 7px}
#modal{position:fixed;inset:0;background:rgba(10,18,28,.55);z-index:90;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 22px 26px;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
#modal h3{font-size:16px;margin-bottom:4px}
#modal .hint{font-size:12px;color:var(--muted);margin-bottom:10px}
#annoText{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical}
#annoText:focus{outline:none;border-color:var(--gold)}
#modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
#modal .acts button{border-radius:9px;padding:9px 18px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff}
#modal .acts .primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}

/* ===== 响应式 ===== */
@media (max-width:1020px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .grid4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  #sidebar{transform:translateX(-105%)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0;padding:18px 14px 100px}
  #topbar{display:flex}
  #scrim.show{display:block}
  .grid2,.chart-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .card{padding:16px 15px}
  .hero h1{font-size:21px}
  #fab{right:14px;bottom:18px;padding:10px 16px}
}
@media print{
  #sidebar,#topbar,#fab,#scrim,#modal,.noprint{display:none!important}
  #main{margin:0;padding:0;max-width:none}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <div class="logo">
      <div class="en">SUPER U · Group</div>
      <div class="zh serif">四店经营对比看板</div>
      <div class="win">基线 2026-06-20 ~ 09-17（90 天）<br>U1 superudisplay · U2 superushop · U3 Finey · U4 荣欣</div>

    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="scrim"></div>
  <div id="app-main-wrap">
    <header id="topbar">
      <button id="burger" aria-label="菜单">☰</button>
      <div class="t serif" id="topTitle">四店经营对比看板</div>
    </header>
    <main id="main"></main>
  </div>
</div>

<button id="fab" class="noprint">📝 整页标注</button>
<button id="selBtn" class="noprint">📝 标注此段</button>

<div id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <h3 class="serif">📝 在本页写标注</h3>
    <div class="hint" id="annoPage"></div>
    <textarea id="annoText" placeholder="写下你的判断、待办或质疑…&#10;例如：P0-1 推工厂先停一周看数据。"></textarea>
    <div class="acts">
      <button id="annoCancel">取消</button>
      <button id="annoSave" class="primary">保存标注</button>
    </div>
  </div>
</div>

<script src="data.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>
